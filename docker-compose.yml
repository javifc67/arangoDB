services:
  arangodb:
    image: arangodb/enterprise-preview:4.0-nightly
    container_name: arangodb
    restart: unless-stopped
    ports:
      - "${ARANGO_PORT:-8529}:8529"
    environment:
      ARANGO_ROOT_PASSWORD: ${ARANGO_ROOT_PASSWORD:-rootpassword}
    volumes:
      - arangodb_data:/var/lib/arangodb3
      - arangodb_apps:/var/lib/arangodb3-apps
    # Si deseas habilitar opciones adicionales como índices vectoriales o límites de memoria:
    # command:
    #   - arangod
    #   - --vector-index=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8529/_api/version"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  arangodb_data:
  arangodb_apps:
